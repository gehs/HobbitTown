name: Manual ESP32 Build

on: 
  workflow_dispatch: # This is the ONLY trigger. No auto-builds.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run PlatformIO Build
        # This command tells PIO to look in the current directory (.) 
        # for your platformio.ini file.
        run: pio run -d . 

      - name: Upload Firmware Binary
        uses: actions/upload-artifact@v4
        with:
          name: manual-esp32-binary
          path: .pio/build/*/firmware.bin