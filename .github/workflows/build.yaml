name: Manual ESP32 Build

on: 
  workflow_dispatch: # This is the ONLY trigger. No auto-builds.

jobs:
  build:
    name: Build esp32dev firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Show build environment
        run: |
          python --version
          pio --version
          pio system info

      - name: Run PlatformIO Build
        run: pio run -d . -e esp32dev

      - name: Upload esp32dev build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manual-esp32dev-build
          if-no-files-found: error
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/firmware.elf
            .pio/build/esp32dev/firmware.map