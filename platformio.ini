; PlatformIO Project Configuration
; Target: ESP32 Dev Module (ESP-WROOM-32)

[platformio]
default_envs = esp32dev
src_dir = firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  dfrobot/DFRobotDFPlayerMini @ ^1.0.6

; Uncomment and set your serial port if auto-detect fails.
; upload_port = COM3
; monitor_port = COM3
