; PlatformIO Project Configuration
; Target: ESP32 Dev Module (ESP-WROOM-32)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Keep the existing project layout intact.
src_dir = firmware

monitor_speed = 115200

lib_deps =
  dfrobot/DFRobotDFPlayerMini @ ^1.0.6

; Uncomment and set your serial port if auto-detect fails.
; upload_port = COM3
; monitor_port = COM3
